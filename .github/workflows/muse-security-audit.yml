name: Muse Security Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit:
    name: Muse Bot Security & Test Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run Offline Test Suite & Audit
        run: |
          npm test
          npm audit --audit-level=high

      - name: Static Security Scan & Optional Muse Bot Report
        env:
          MUSE_BOT_APP_ID: ${{ secrets.MUSE_BOT_APP_ID }}
          MUSE_BOT_PRIVATE_KEY: ${{ secrets.MUSE_BOT_PRIVATE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node - <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const rules = [
            { name: 'private_key', re: /-----BEGIN [A-Z ]*PRIVATE KEY-----/ },
            { name: 'tls_bypass', re: /rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED/ },
            { name: 'dynamic_eval', re: /\b(eval|Function)\s*\(/ },
            { name: 'github_token', re: /\b(ghp|gho|ghs|ghu|github_pat)_[A-Za-z0-9_]{20,}/ },
            { name: 'local_home_path', re: /\/(home|Users)\/[a-zA-Z0-9_-]+\// }
          ];
          const hits = [];
          for (const f of files) {
            if (/\.(png|svg|jpg)$/i.test(f) || f === '.github/workflows/muse-security-audit.yml') continue;
            const lines = fs.readFileSync(f, 'utf8').split('\n');
            lines.forEach((line, idx) => {
              for (const r of rules) {
                if (r.re.test(line)) hits.push(`${f}:${idx + 1} [${r.name}]`);
              }
            });
          }

          const shortSha = (process.env.HEAD_SHA || '').slice(0, 7);
          const report = [
            `### 🤖 \`dalroot-muse-bot[bot]\` Automated Security & Test Audit (\`${shortSha}\`)`,
            '',
            '- ✅ **Gitleaks Secret Scan:** 0 leaks',
            `- ${hits.length === 0 ? '✅' : '❌'} **Static Dangerous-Pattern Scan:** ${files.length} tracked files scanned, **${hits.length} hits**`,
            '- ✅ **Offline Test Suite (`npm test`):** Passed',
            '- ✅ **Dependency Audit (`npm audit --audit-level=high`):** Passed'
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          if (hits.length > 0) {
            console.error('Security scan hits:\n' + hits.join('\n'));
            process.exit(1);
          }

          const appId = (process.env.MUSE_BOT_APP_ID || '').trim();
          const pem = (process.env.MUSE_BOT_PRIVATE_KEY || '').trim();
          if (appId && pem && process.env.PR_NUMBER && process.env.REPO) {
            (async () => {
              const now = Math.floor(Date.now() / 1000);
              const b64 = (v) => Buffer.from(v).toString('base64url');
              const hdr = b64(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
              const pld = b64(JSON.stringify({ iat: now - 60, exp: now + 300, iss: appId }));
              const sig = crypto.sign('RSA-SHA256', Buffer.from(`${hdr}.${pld}`), pem).toString('base64url');
              const jwt = `${hdr}.${pld}.${sig}`;
              const gh = async (method, url, token, body) => {
                const res = await fetch(`https://api.github.com${url}`, {
                  method,
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: `Bearer ${token}`,
                    'user-agent': 'muse-security-audit'
                  },
                  body: body ? JSON.stringify(body) : undefined
                });
                if (!res.ok) throw new Error(`GitHub ${method} ${url}: ${res.status}`);
                return res.json();
              };
              const inst = await gh('GET', `/repos/${process.env.REPO}/installation`, jwt);
              const tok = await gh('POST', `/app/installations/${inst.id}/access_tokens`, jwt);
              await gh('POST', `/repos/${process.env.REPO}/issues/${process.env.PR_NUMBER}/comments`, tok.token, { body: report });
            })().catch((e) => { console.error(e); process.exit(1); });
          }
          EOF
